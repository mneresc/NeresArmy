name: Supply Chain Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Review dependency changes
        id: dependency-review
        continue-on-error: true
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          comment-summary-in-pr: always
          show-openssf-scorecard: true
      - name: Record unavailable dependency graph
        if: steps.dependency-review.outcome == 'failure'
        run: echo "::warning::GitHub Dependency Review is unavailable. Enable Dependency Graph; runtime npm audit remains mandatory."

  package-report:
    name: package-report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate package and vendored assets
        run: npm run check --workspace @mneresc/neres-agentic-bmad
      - name: Generate npm audit report and CycloneDX SBOM
        run: npm run security:report --workspace @mneresc/neres-agentic-bmad
      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: neres-agentic-supply-chain-${{ github.sha }}
          path: security-reports/
          if-no-files-found: error
          retention-days: 90
