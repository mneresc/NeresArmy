name: Supply Chain Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          comment-summary-in-pr: always
          show-openssf-scorecard: true

  package-report:
    name: package-report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate package and vendored assets
        run: npm run check --workspace @mneresc/neres-agentic-bmad
      - name: Generate npm audit report and CycloneDX SBOM
        run: npm run security:report --workspace @mneresc/neres-agentic-bmad
      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: neres-agentic-supply-chain-${{ github.sha }}
          path: security-reports/
          if-no-files-found: error
          retention-days: 90
